services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4633:4633"
    volumes:
      - .:/workspace
      - ./music:/music:ro
      - ./data:/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      ND_PORT: "4633"
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_DEVAUTOCREATEADMINPASSWORD: "admin"
    command: sh -c "mkdir -p ui/build/3rdparty && touch ui/build/3rdparty/placeholder && go mod download && go tool reflex -d none -c reflex.conf"

  frontend:
    image: node:24
    working_dir: /app
    ports:
      - "4533:4533"
    volumes:
      - ./ui:/app
      - node-modules:/app/node_modules
    environment:
      PORT: "4533"
      BACKEND_HOST: backend
    command: sh -c "npm ci && npm start"
    depends_on:
      - backend

  frontend-test:
    image: node:24
    working_dir: /app
    volumes:
      - ./ui:/app
      - node-modules:/app/node_modules
    command: sh -c "npm ci && npm test"
    profiles:
      - test

  playwright-level3:
    image: node:24
    working_dir: /app
    volumes:
      - ./ui:/app
      - node-modules:/app/node_modules
      - playwright-cache:/root/.cache/ms-playwright
    environment:
      BASE_URL: http://frontend:4533
      BACKEND_URL: http://backend:4633
    # Wait for both services to accept connections before running tests.
    command: >
      sh -c "
        npm ci &&
        npx playwright install --with-deps chromium &&
        echo 'Waiting for backend...' &&
        until wget -qO- http://backend:4633/ping >/dev/null 2>&1; do sleep 2; done &&
        echo 'Waiting for frontend...' &&
        until wget -qO- http://frontend:4533 >/dev/null 2>&1; do sleep 2; done &&
        echo 'Services ready. Running Level 3 E2E tests...' &&
        npm run test:e2e:level3
      "
    depends_on:
      - backend
      - frontend
    profiles:
      - level3-e2e

volumes:
  go-mod-cache:
  go-build-cache:
  node-modules:
  playwright-cache:
